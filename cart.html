<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your bag | The Wellness Edit</title>
  <meta name="description" content="Your shopping bag at The Wellness Edit.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="cart">
  <div id="site-header"></div>

  <main id="main">
    <div class="wrap" id="cart-page">
      <section class="page-hero" style="padding-bottom:32px">
        <p class="breadcrumb"><a href="index.html">Home</a> / Bag</p>
        <h1>Your bag.</h1>
      </section>

      <div class="cart-layout">
        <div id="cart-root"></div>
        <aside class="summary" id="cart-summary">
          <h2>Summary</h2>
          <p class="small" id="ship-msg" style="margin:0"></p>
          <div class="ship-meter"><span id="ship-bar"></span></div>
          <div class="summary-row"><span>Subtotal</span><span id="sum-sub"></span></div>
          <div class="summary-row"><span>Shipping</span><span id="sum-ship"></span></div>
          <div class="summary-row"><span>Est. tax</span><span id="sum-tax"></span></div>
          <div class="summary-row total"><span>Total</span><span id="sum-total"></span></div>
          <button class="btn btn-block" id="to-checkout" type="button" style="margin-top:20px"><span>Checkout</span></button>
          <div class="secure-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Secure checkout · <a class="text-link" href="security.html">Learn more</a></div>
        </aside>
      </div>

      <section class="checkout" id="checkout" style="padding-bottom:var(--section)">
        <h2>Checkout</h2>
        <form class="form" id="checkout-form" style="max-width:760px">
          <div class="form-row">
            <div class="field"><label for="k-name">Full name</label><input id="k-name" required autocomplete="name"></div>
            <div class="field"><label for="k-email">Email</label><input id="k-email" type="email" required autocomplete="email"></div>
          </div>
          <div class="field"><label for="k-addr">Address</label><input id="k-addr" required autocomplete="street-address"></div>
          <div class="form-row">
            <div class="field"><label for="k-city">City</label><input id="k-city" required></div>
            <div class="field">
              <label for="k-country">Country</label>
              <select id="k-country"><option>United States</option><option>Canada</option><option>México</option><option>United Kingdom</option><option>France</option><option>India</option><option>Nepal</option><option>Japan</option></select>
            </div>
          </div>
          <div class="form-row">
            <div class="field"><label for="k-card">Card number (demo)</label><input id="k-card" inputmode="numeric" placeholder="4242 4242 4242 4242" required pattern="[0-9 ]{12,23}" autocomplete="off"></div>
            <div class="field"><label for="k-exp">Expiry</label><input id="k-exp" placeholder="MM/YY" required pattern="[0-9]{2}/[0-9]{2}" autocomplete="off"></div>
          </div>
          <p class="form-note">Demo checkout for a school project: no payment is taken and nothing you type is sent or stored.</p>
          <div><button class="btn" type="submit">Place order</button></div>
        </form>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="js/main.js"></script>
</body>
</html>
